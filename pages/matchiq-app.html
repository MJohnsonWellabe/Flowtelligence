<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MatchIQ — Coverage Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
/* ── Reset & Palette ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --navy:   #0B1C2C;
  --navy2:  #0C3B4F;
  --teal:   #0B7A8C;
  --aqua:   #12B5CC;
  --gold:   #FFC220;
  --wb:     #FFC220;   /* brand yellow */
  --wb-lt:  #FFF3DC;   /* brand yellow pale */
  --white:  #FFFFFF;
  --cream:  #F5F2ED;
  --gray:   #E2EBF0;
  --muted:  #6A8899;
  --ink:    #1A2E3D;
  --serif:  'EB Garamond', Georgia, serif;
  --sans:   'DM Sans', system-ui, sans-serif;
}
html,body{height:100%;background:var(--cream);font-family:var(--sans);color:var(--ink);}

/* ── Header ── */
.hdr{
  background:var(--navy);border-bottom:2px solid var(--wb);
  padding:.75rem 1.75rem;display:flex;align-items:center;gap:.85rem;
  position:sticky;top:0;z-index:100;
}
.hdr-brand{font-family:var(--serif);font-size:1.35rem;font-weight:700;color:var(--white);line-height:1;}
.hdr-brand span{color:var(--wb);}
.hdr-sub{font-size:.6rem;color:rgba(255,255,255,.45);letter-spacing:.05em;margin-top:2px;}
.hdr-badge{margin-left:auto;background:var(--wb);color:var(--navy);
  font-size:.65rem;font-weight:700;padding:.28rem .8rem;border-radius:999px;letter-spacing:.06em;}

/* ── Layout ── */
.shell{
  max-width:900px;margin:0 auto;padding:2rem 1.25rem;
  display:grid;grid-template-columns:1fr 320px;gap:1.75rem;align-items:start;
}
@media(max-width:768px){.shell{grid-template-columns:1fr;}}

/* ── Chat panel ── */
.chat-panel{
  background:var(--white);border-radius:16px;
  box-shadow:0 4px 24px rgba(11,28,44,.1);
  display:flex;flex-direction:column;min-height:520px;overflow:hidden;
}
.chat-top{
  background:var(--navy2);padding:1rem 1.25rem;
  display:flex;align-items:center;gap:.75rem;
}
.chat-avatar{
  width:40px;height:40px;border-radius:50%;
  background:var(--wb);display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:1.1rem;font-weight:700;color:var(--navy);flex-shrink:0;
}
.chat-top-info h3{font-size:.92rem;font-weight:700;color:var(--white);margin:0;}
.chat-top-info p{font-size:.72rem;color:rgba(255,255,255,.5);margin:0;}
.chat-status{margin-left:auto;width:8px;height:8px;border-radius:50%;background:#48BB78;}

.chat-msgs{flex:1;padding:1.25rem;display:flex;flex-direction:column;gap:.85rem;overflow-y:auto;max-height:440px;}

/* bubbles */
.msg{display:flex;gap:.6rem;align-items:flex-end;}
.msg.agent{flex-direction:row;}
.msg.user{flex-direction:row-reverse;}
.msg-av{
  width:28px;height:28px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:.65rem;font-weight:700;
}
.msg.agent .msg-av{background:var(--wb);color:var(--navy);}
.msg.user  .msg-av{background:var(--navy);color:var(--white);}
.bubble{
  max-width:82%;padding:.65rem .9rem;border-radius:12px;
  font-size:.88rem;line-height:1.55;
}
.msg.agent .bubble{
  background:var(--cream);color:var(--ink);
  border-radius:2px 12px 12px 12px;
}
.msg.user .bubble{
  background:var(--navy);color:var(--white);
  border-radius:12px 2px 12px 12px;
}
.bubble strong{color:var(--wb);}
.typing{display:flex;gap:4px;align-items:center;padding:.5rem .75rem;}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--muted);
  animation:bounce .9s infinite ease-in-out;}
.typing span:nth-child(2){animation-delay:.15s;}
.typing span:nth-child(3){animation-delay:.3s;}
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}

/* choice buttons */
.choices{display:flex;flex-wrap:wrap;gap:.5rem;padding:.5rem 0 .25rem;}
.choice-btn{
  padding:.48rem 1rem;border-radius:8px;border:1.5px solid var(--gray);
  background:var(--white);color:var(--ink);font-family:var(--sans);
  font-size:.83rem;font-weight:500;cursor:pointer;transition:all .18s;text-align:left;
}
.choice-btn:hover{border-color:var(--wb);color:var(--wb);background:var(--wb-lt);}
.choice-btn.sel{border-color:var(--wb);background:var(--wb);color:var(--navy);font-weight:700;}

/* multi-select */
.ms-hint{font-size:.72rem;color:var(--muted);padding:.1rem 0 .15rem;width:100%;}
.ms-continue{
  margin:.35rem 0 .25rem;background:var(--wb);border:none;border-radius:8px;
  padding:.5rem 1.2rem;color:var(--navy);font-family:var(--sans);
  font-size:.83rem;font-weight:700;cursor:pointer;transition:background .18s;
}
.ms-continue:hover{background:#F0B840;}
.ms-continue:disabled{background:var(--gray);color:var(--muted);cursor:default;}

/* free text input */
.chat-input-row{
  padding:.85rem 1.1rem;border-top:1px solid var(--gray);
  display:flex;gap:.6rem;align-items:center;
}
.chat-input{
  flex:1;border:1.5px solid var(--gray);border-radius:8px;
  padding:.52rem .85rem;font-family:var(--sans);font-size:.88rem;color:var(--ink);
  outline:none;transition:border-color .18s;
}
.chat-input:focus{border-color:var(--wb);}
.chat-send{
  background:var(--wb);border:none;border-radius:8px;
  padding:.52rem 1.1rem;color:var(--navy);font-family:var(--sans);
  font-size:.83rem;font-weight:700;cursor:pointer;transition:background .18s;white-space:nowrap;
}
.chat-send:hover{background:#F0B840;}
.chat-send:disabled{background:var(--gray);color:var(--muted);cursor:default;}

/* ── Right panel ── */
.right-panel{display:flex;flex-direction:column;gap:1.25rem;}

/* profile card */
.profile-card{
  background:var(--white);border-radius:14px;
  box-shadow:0 3px 16px rgba(11,28,44,.08);
  overflow:hidden;
}
.profile-hdr{
  background:var(--navy);padding:.85rem 1.1rem;
  display:flex;align-items:center;gap:.75rem;
}
.profile-initials{
  width:44px;height:44px;border-radius:50%;background:var(--wb);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:1.1rem;font-weight:700;color:var(--navy);
}
.profile-name{font-family:var(--serif);font-size:1.05rem;font-weight:700;color:var(--white);}
.profile-sub{font-size:.72rem;color:rgba(255,255,255,.5);margin-top:1px;}
.profile-body{padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.55rem;}
.profile-row{display:flex;justify-content:space-between;align-items:center;gap:.5rem;}
.profile-label{font-size:.75rem;color:var(--muted);font-weight:500;}
.profile-val{font-size:.82rem;color:var(--ink);font-weight:600;text-align:right;}
.badge{
  font-size:.65rem;font-weight:700;padding:.18rem .55rem;border-radius:999px;
  letter-spacing:.04em;
}
.badge-wb{background:var(--wb-lt);color:#7A5008;}
.badge-teal{background:#E0F5F8;color:var(--teal);}
.badge-gray{background:var(--gray);color:var(--muted);}

/* results card */
.results-card{
  background:var(--white);border-radius:14px;
  box-shadow:0 3px 16px rgba(11,28,44,.08);
  overflow:hidden;transition:all .3s;
}
.results-hdr{
  background:var(--navy2);padding:.85rem 1.1rem;
  display:flex;align-items:center;justify-content:space-between;
}
.results-hdr h3{font-family:var(--serif);font-size:1rem;font-weight:700;color:var(--white);}
.results-hdr .score-pill{
  background:var(--wb);color:var(--navy);
  font-size:.72rem;font-weight:700;padding:.22rem .7rem;border-radius:999px;
}
.results-body{padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.85rem;}

.rec-card{
  border:1.5px solid var(--gray);border-radius:10px;padding:.85rem;
  transition:border-color .2s,box-shadow .2s;
}
.rec-card:hover{border-color:var(--wb);box-shadow:0 3px 12px rgba(232,160,32,.15);}
.rec-card.top{border-color:var(--wb);border-width:2px;}
.rec-top-row{display:flex;align-items:center;gap:.6rem;margin-bottom:.5rem;}
.rec-num{
  width:24px;height:24px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:.72rem;font-weight:700;flex-shrink:0;
}
.rec-num.n1{background:var(--wb);color:var(--navy);}
.rec-num.n2{background:var(--navy2);color:var(--white);}
.rec-num.n3{background:var(--gray);color:var(--muted);}
.rec-num.n4{background:var(--gray);color:var(--muted);}
.rec-num.n5{background:var(--gray);color:var(--muted);}
.rec-name{font-weight:700;font-size:.88rem;color:var(--ink);flex:1;}
.best-badge{
  font-size:.6rem;font-weight:700;background:var(--wb);color:var(--navy);
  padding:.12rem .45rem;border-radius:4px;letter-spacing:.04em;
}
.rec-desc{font-size:.78rem;color:var(--muted);margin-bottom:.6rem;line-height:1.5;}

/* tier / add-on blocks */
.rec-config{
  font-size:.76rem;color:var(--ink);background:var(--wb-lt);
  border-radius:6px;padding:.4rem .6rem;margin-bottom:.6rem;line-height:1.45;
}
.rec-config strong{color:#7A5008;}
.rec-block-h{
  font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);margin:.55rem 0 .3rem;
}

.match-bar-wrap{margin-bottom:.55rem;}
.match-bar-label{display:flex;justify-content:space-between;margin-bottom:.25rem;}
.match-bar-label span{font-size:.7rem;color:var(--muted);}
.match-bar-label strong{font-size:.78rem;color:var(--wb);font-weight:700;}
.match-bar-track{height:7px;background:var(--gray);border-radius:4px;overflow:hidden;}
.match-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--teal),var(--wb));
  transition:width 1s ease;width:0;}
.rec-reasons{list-style:none;display:flex;flex-direction:column;gap:.3rem;}
.rec-reasons li{font-size:.75rem;color:var(--ink);display:flex;align-items:flex-start;gap:.4rem;}
.rec-reasons li::before{content:"";width:6px;height:6px;border-radius:50%;
  background:var(--wb);flex-shrink:0;margin-top:.35rem;}
.rec-addons li::before{background:var(--teal);}
.rec-addons li strong{color:var(--ink);}
.rec-cta{
  margin-top:.7rem;width:100%;padding:.5rem;border-radius:7px;
  background:var(--wb);border:none;color:var(--navy);
  font-family:var(--sans);font-size:.8rem;font-weight:700;cursor:pointer;
  transition:background .18s;
}
.rec-cta:hover{background:#F0B840;}

/* modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(11,28,44,.6);
  z-index:999;display:flex;align-items:center;justify-content:center;
  padding:1rem;opacity:0;pointer-events:none;transition:opacity .25s;
}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal{
  background:var(--white);border-radius:16px;padding:2rem;
  max-width:400px;width:100%;
  box-shadow:0 12px 48px rgba(11,28,44,.25);
  transform:translateY(12px);transition:transform .25s;
}
.modal-overlay.open .modal{transform:translateY(0);}
.modal h3{font-family:var(--serif);font-size:1.25rem;color:var(--navy);margin-bottom:.5rem;}
.modal p{font-size:.88rem;color:var(--muted);line-height:1.6;margin-bottom:1.5rem;}
.modal-btns{display:flex;gap:.75rem;}
.modal-ok{
  flex:1;padding:.6rem;border-radius:8px;background:var(--wb);
  border:none;color:var(--navy);font-family:var(--sans);font-size:.88rem;
  font-weight:700;cursor:pointer;
}
.modal-cancel{
  flex:1;padding:.6rem;border-radius:8px;
  border:1.5px solid var(--gray);background:var(--white);
  color:var(--muted);font-family:var(--sans);font-size:.88rem;cursor:pointer;
}
.hidden{display:none!important;}
</style>
</head>
<body>

<!-- Header -->
<header class="hdr">
  <div>
    <div class="hdr-brand">Match<span>IQ</span></div>
    <div class="hdr-sub">Powered by Lowtech &nbsp;·&nbsp; Coverage Finder</div>
  </div>
  <div class="hdr-badge">AGENT TOOL</div>
</header>

<div class="shell">

  <!-- LEFT: Chat -->
  <div class="chat-panel">
    <div class="chat-top">
      <div class="chat-avatar">M</div>
      <div class="chat-top-info">
        <h3>MatchIQ Assistant</h3>
        <p>Your personal coverage guide</p>
      </div>
      <div class="chat-status"></div>
    </div>

    <div class="chat-msgs" id="msgs"></div>

    <div class="chat-input-row" id="inputRow">
      <input class="chat-input" id="freeInput" placeholder="Type your answer..." autocomplete="off"/>
      <button class="chat-send" id="sendBtn" onclick="sendFree()">Send</button>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="right-panel">

    <!-- Profile -->
    <div class="profile-card">
      <div class="profile-hdr">
        <div class="profile-initials" id="pInitials">?</div>
        <div>
          <div class="profile-name" id="pName">New Applicant</div>
          <div class="profile-sub" id="pSub">Gathering information...</div>
        </div>
      </div>
      <div class="profile-body" id="profileBody">
        <div class="profile-row">
          <span class="profile-label">Age</span>
          <span class="profile-val" id="pAge">—</span>
        </div>
        <div class="profile-row">
          <span class="profile-label">Medicare</span>
          <span class="profile-val" id="pState">—</span>
        </div>
        <div class="profile-row">
          <span class="profile-label">Tobacco</span>
          <span class="profile-val" id="pTobacco">—</span>
        </div>
        <div class="profile-row">
          <span class="profile-label">Coverage</span>
          <span id="pEnroll" class="badge badge-gray">Unknown</span>
        </div>
        <div class="profile-row">
          <span class="profile-label">Focus</span>
          <span class="profile-val" id="pPriority">—</span>
        </div>
      </div>
    </div>

    <!-- Results (hidden until ready) -->
    <div class="results-card hidden" id="resultsCard">
      <div class="results-hdr">
        <h3>Coverage Recommendations</h3>
        <div class="score-pill" id="overallScore">Matching...</div>
      </div>
      <div class="results-body" id="resultsBody"></div>
    </div>

  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3 id="modalTitle">Start Application?</h3>
    <p id="modalBody"></p>
    <div class="modal-btns">
      <button class="modal-ok" onclick="closeModal()">Open Enroller</button>
      <button class="modal-cancel" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════════════════
   MatchIQ v2 — advisor-led consultation.
   Instead of marching down an application form, the conversation works like a
   real Medicare/insurance advisor: it figures out WHO the person is
   (Med Supp candidate / Medigap holder / Medicare Advantage enrollee /
   under-65), asks the questions that genuinely differentiate plan choices
   (self-insure → High-Deductible G, excess charges → G vs N), then educates on
   real coverage gaps and recommends coverage products to close them. Branching
   is handled by a keyed node graph; recommendations are assembled from the
   track + the gaps the person flags. Facts are current to 2026.
   ════════════════════════════════════════════════════════════════════════ */

// ── State ─────────────────────────────────────────────────────────────────
const profile = {
  name:'', age:null, tobacco:null, healthStatus:'',
  medicareStage:'', medicareCoverage:'', currentCoverage:'',
  msInterest:'', msWhyAns:'', msTravel:'', budget:'', selfInsure:'', excessPref:'',
  maCarrier:'', gaps:[], preneedConcern:''
};

let currentNodeId = null;
let currentFreeNode = null;
let freeKey = '';

function firstName(){ return (profile.name||'').trim().split(/\s+/)[0] || ''; }

// ── Products ──────────────────────────────────────────────────────
// `tiers` = plan-level configuration; `riders` = optional components. Each
// fits(p) predicate reads the profile (gaps array, age, health, tobacco, budget).
const PRODUCTS = {
  medsupp:{
    name:'Medicare Supplement',
    short:'Medicare Supplement',
    desc:'Pairs with Original Medicare to cover the gaps it leaves — deductibles, copays, and coinsurance — so your costs become predictable and you keep any doctor that takes Medicare.',
    eligibility:'Age 65+ enrolled in Medicare Part B',
    tiers:[
      {id:'HDG',label:'High-Deductible Plan G',desc:'Lowest premium; you cover about $2,950 a year before it pays, then full coverage.'},
      {id:'N',label:'Plan N',desc:'Lower premium with small office and ER copays; no excess-charge coverage.'},
      {id:'G',label:'Plan G',desc:'The most comprehensive — covers every gap including Part B excess charges.'},
    ]
  },
  hospital:{
    name:'Hospital Indemnity',
    short:'Hospital Indemnity',
    desc:'Pays cash directly to you for each day of a covered hospital stay — perfect for covering Medicare Advantage daily copays or a Supplement’s deductible. Spend it on anything.',
    eligibility:'Ages 18–84, simplified underwriting',
    tiers:[
      {id:'b100',label:'$100/day benefit',desc:'Lighter premium, solid core protection.',fits:p=>p.budget==='low'},
      {id:'b200',label:'$200/day benefit',desc:'A balanced level of daily cash.',fits:p=>p.budget==='mid'},
      {id:'b300',label:'$300/day benefit',desc:'The strongest daily cash benefit.',fits:p=>true},
    ],
    riders:[
      {id:'er',label:'Emergency Room & Urgent Care rider',desc:'Cash for ER and urgent-care visits, admitted or not.',fits:p=>has(p,'accident')||has(p,'hospital')},
      {id:'amb',label:'Ambulance rider',desc:'Covers ground or air ambulance transport.',fits:p=>p.age>=70},
      {id:'snf',label:'Skilled Nursing & Observation rider',desc:'Extends benefits to rehab and observation stays Medicare cuts off.',fits:p=>has(p,'facility')||p.healthStatus==='chronic'||p.age>=75},
      {id:'lump',label:'Lump-Sum Critical Illness rider',desc:'Adds a cash payout if cancer, heart attack, or stroke is diagnosed.',fits:p=>has(p,'critical')||p.tobacco},
    ],
    reasons:function(p){
      const r=[];
      r.push('Cash paid straight to you — covers daily hospital copays or a deductible');
      if(p.medicareCoverage==='ma') r.push('Fills the per-day copays Medicare Advantage charges for a hospital stay');
      r.push('No medical exam — simplified underwriting');
      return r.slice(0,3);
    }
  },
  dental:{
    name:'Dental, Vision & Hearing',
    short:'Dental · Vision · Hearing',
    desc:'Covers the three things Original Medicare and Medigap ignore entirely — routine dental, eye exams and eyewear, and hearing exams and hearing aids.',
    eligibility:'Ages 18–85, guaranteed issue available',
    tiers:[
      {id:'major',label:'Comprehensive (includes major work)',desc:'Adds crowns, root canals, and dentures.',fits:p=>p.age>=50||p.healthStatus==='chronic'},
      {id:'prev',label:'Preventive + Basic',desc:'Cleanings, X-rays, and fillings.',fits:p=>true},
    ],
    riders:[
      {id:'vis',label:'Vision coverage',desc:'Annual eye exam plus an eyewear allowance.',fits:p=>has(p,'dvh')},
      {id:'hear',label:'Hearing coverage',desc:'Hearing exams and a hearing-aid allowance — a brutal out-of-pocket cost otherwise.',fits:p=>has(p,'dvh')||p.age>=65},
    ],
    reasons:function(p){
      const r=[];
      r.push('Closes the dental, vision & hearing gap Medicare leaves wide open');
      r.push('No waiting period on preventive cleanings and exams');
      r.push('Hearing-aid help — one of the biggest uncovered costs for seniors');
      return r.slice(0,3);
    }
  },
  vision:{
    name:'Vision Insurance',
    short:'Vision',
    desc:'Covers annual eye exams, frames, lenses, and contacts, with allowances at major optical retailers.',
    eligibility:'Ages 18–79, guaranteed issue',
    riders:[
      {id:'hear',label:'Hearing coverage',desc:'Adds hearing exams and a hearing-aid allowance.',fits:p=>p.age>=65},
    ],
    reasons:function(p){
      return ['Annual exam plus an allowance for frames or contacts','Guaranteed issue — no health questions'];
    }
  },
  cancer:{
    name:'Cancer & Critical Illness',
    short:'Cancer / Critical Illness',
    desc:'Pays a lump-sum cash benefit on first diagnosis of cancer, heart attack, or stroke — exactly the bills Medicare and Advantage out-of-pocket maximums leave you exposed to. Use it for anything.',
    eligibility:'Ages 18–69, simplified underwriting',
    tiers:[
      {id:'l10',label:'$10,000 lump sum',desc:'Affordable core protection.',fits:p=>p.budget==='low'},
      {id:'l25',label:'$25,000 lump sum',desc:'A meaningful cash cushion.',fits:p=>p.budget==='mid'},
      {id:'l50',label:'$50,000 lump sum',desc:'Maximum cash at diagnosis.',fits:p=>true},
    ],
    riders:[
      {id:'hs',label:'Heart Attack & Stroke rider',desc:'Extends the lump sum to cardiac and stroke events.',fits:p=>has(p,'critical')||p.age>=50||p.tobacco},
      {id:'rec',label:'Recurrence Benefit rider',desc:'Pays again if cancer returns after remission.',fits:p=>p.age>=40},
      {id:'well',label:'Wellness & Screening rider',desc:'Cash back for staying on top of screenings.',fits:p=>p.healthStatus==='good'},
    ],
    reasons:function(p){
      const r=[];
      r.push('Lump sum paid at diagnosis — no receipts, no restrictions');
      if(p.medicareCoverage==='ma') r.push('Cushions the out-of-pocket max your Advantage plan exposes you to');
      else r.push('Covers what a Supplement won’t — the financial shock of a serious diagnosis');
      if(p.tobacco) r.push('Tobacco use raises the risk, so this protection matters even more');
      return r.slice(0,3);
    }
  },
  accident:{
    name:'Accident Insurance',
    short:'Accident Insurance',
    desc:'Pays cash for injuries from covered accidents and falls — ER visits, fractures, ambulance, and follow-up — on top of any other coverage.',
    eligibility:'Ages 18–84, simplified underwriting',
    tiers:[
      {id:'a1',label:'Core benefit level',desc:'Solid everyday accident protection.',fits:p=>p.budget==='low'},
      {id:'a2',label:'Enhanced benefit level',desc:'Higher payouts across the board.',fits:p=>true},
    ],

// ── Recommendation engine ──────────────────────────────────────────────────
function deriveTrack(p){
  if(p.medicareStage==='under65') return 'u65';
  if(p.medicareCoverage==='ma' || p.msInterest==='lean' || p.msWhyAns==='lean') return 'ma';
  if(p.medicareCoverage==='medigap') return 'mshave';
  return 'ms';
}

function pickMsPlan(p){
  if(p.selfInsure==='yes') return 'HDG';
  if(p.excessPref==='savings') return 'N';
  return 'G';
}

const GAP_TO_PRODUCT = { dvh:'dental', facility:'stc', critical:'cancer', accident:'accident', hospital:'hospital' };

function expandGaps(p, track){
  let gaps = Array.isArray(p.gaps) ? p.gaps.slice() : [];
  if(gaps.indexOf('none') >= 0) return [];
  if(gaps.indexOf('all') >= 0){
    gaps = track==='ma'  ? ['hospital','critical','dvh','accident']
         : track==='u65' ? ['accident','critical','dvh','hospital']
         :                  ['dvh','facility','critical','accident'];
  }
  const keys = [];
  gaps.forEach(g=>{ const k=GAP_TO_PRODUCT[g]; if(k && keys.indexOf(k)<0) keys.push(k); });
  return keys;
}

function pickTier(product){
  if(!product.tiers) return null;
  return product.tiers.find(t=> t.fits ? t.fits(profile) : true) || product.tiers[product.tiers.length-1];
}
function pickRiders(product){
  if(!product.riders) return [];
  return product.riders.filter(r=>r.fits(profile)).slice(0,3);
}

function msReasons(p){
  const r=[];
  r.push('Keeps you with any doctor that accepts Medicare — no networks, no referrals');
  if(p.msTravel==='yes') r.push('Travels with you anywhere in the country');
  if(p.selfInsure==='yes') r.push('High-deductible design keeps your premium low while you stay healthy');
  else if(p.excessPref==='protect') r.push('Plan G shields you from Part B excess charges, start to finish');
  else if(p.excessPref==='savings') r.push('Plan N trims your premium down to small office and ER copays');
  else r.push('Turns most hospital and doctor bills into one predictable premium');
  return r.slice(0,3);
}

function buildRecommendations(){
  const p = profile;
  const track = deriveTrack(p);
  const recs = [];

  if(track==='ms'){
    const tierId = pickMsPlan(p);
    const tier = PRODUCTS.medsupp.tiers.find(t=>t.id===tierId);
    recs.push({ key:'medsupp', product:PRODUCTS.medsupp, score:97, tier:tier, riders:[], reasons:msReasons(p) });
  }

  const gapKeys = expandGaps(p, track);
  let baseScore = 94;
  gapKeys.forEach(k=>{
    const prod = PRODUCTS[k];
    recs.push({ key:k, product:prod, score:baseScore, tier:pickTier(prod), riders:pickRiders(prod), reasons:prod.reasons(p) });
    baseScore -= 3;
  });

  if(p.preneedConcern==='yes'){
    recs.push({ key:'preneed', product:PRODUCTS.preneed, score:89, tier:pickTier(PRODUCTS.preneed), riders:pickRiders(PRODUCTS.preneed), reasons:PRODUCTS.preneed.reasons(p) });
  }

  if(p.budget==='any' && track!=='u65'){
    recs.push({ key:'annuity', product:PRODUCTS.annuity, score:76, tier:null, riders:pickRiders(PRODUCTS.annuity), reasons:PRODUCTS.annuity.reasons(p) });
  }

  if(recs.length===0){
    const fk = track==='ma' ? 'hospital' : 'dental';
    recs.push({ key:fk, product:PRODUCTS[fk], score:85, tier:pickTier(PRODUCTS[fk]), riders:pickRiders(PRODUCTS[fk]), reasons:PRODUCTS[fk].reasons(p) });
  }

  return { track:track, recs:recs.slice(0,6) };
}

// ── DOM helpers ───────────────────────────────────────────────────────────
const msgsEl = document.getElementById('msgs');
const inputRow = document.getElementById('inputRow');
const freeInput = document.getElementById('freeInput');
const sendBtn = document.getElementById('sendBtn');

function scrollBot(){ msgsEl.scrollTop = msgsEl.scrollHeight; }

function addMsg(role, html){
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  const av = document.createElement('div');
  av.className = 'msg-av';
  av.textContent = role==='agent' ? 'M' : 'A';
  const b = document.createElement('div');
  b.className = 'bubble';
  b.innerHTML = html;
  d.appendChild(av); d.appendChild(b);
  msgsEl.appendChild(d);
  scrollBot();
  return d;
}

function addTyping(){
  const d = document.createElement('div');
  d.className = 'msg agent'; d.id = 'typing';
  d.innerHTML = '<div class="msg-av">M</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
  msgsEl.appendChild(d); scrollBot();
}
function removeTyping(){ const t=document.getElementById('typing'); if(t) t.remove(); }

function resolveNext(node, choice){
  let n = (choice && choice.next != null) ? choice.next : node.next;
  if(typeof n === 'function') n = n(profile);
  return n;
}

function addChoices(node){
  const d = document.createElement('div');
  d.className = 'choices';
  node.choices.forEach(c=>{
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = c.label;
    btn.onclick = function(){
      d.querySelectorAll('.choice-btn').forEach(b=>{ b.disabled=true; b.classList.remove('sel'); });
      btn.classList.add('sel');
      profile[node.key] = c.val;
      updateProfile();
      const nxt = resolveNext(node, c);
      setTimeout(()=>{
        d.remove();
        addMsg('user', c.label);
        setInputVisible(false);
        setTimeout(()=>{ addTyping(); setTimeout(()=>{ removeTyping(); advanceStep(nxt); },700); },300);
      },180);
    };
    d.appendChild(btn);
  });
  msgsEl.appendChild(d);
  scrollBot();
}

function addMulti(node){
  const d = document.createElement('div');
  d.className = 'choices';
  const hint = document.createElement('div');
  hint.className = 'ms-hint';
  hint.textContent = 'Pick any that apply, then continue.';
  d.appendChild(hint);

  const selected = [];
  const chips = [];

  function refresh(){
    chips.forEach(x=> x.btn.classList.toggle('sel', selected.indexOf(x.c) >= 0));
    cont.disabled = selected.length === 0;
  }

  node.choices.forEach(c=>{
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = c.label;
    btn.onclick = function(){
      if(c.exclusive){
        selected.length = 0;
        selected.push(c);
      } else {
        for(let i=selected.length-1; i>=0; i--){ if(selected[i].exclusive) selected.splice(i,1); }
        const idx = selected.indexOf(c);
        if(idx>=0) selected.splice(idx,1); else selected.push(c);
      }
      refresh();
    };
    chips.push({ c:c, btn:btn });
    d.appendChild(btn);
  });

  const cont = document.createElement('button');
  cont.className = 'ms-continue';
  cont.textContent = 'Continue →';
  cont.disabled = true;
  cont.onclick = function(){
    const vals = selected.map(s=>s.val);
    const labels = selected.map(s=>s.label);
    profile[node.key] = vals;
    updateProfile();
    d.querySelectorAll('.choice-btn').forEach(b=> b.disabled=true);
    cont.remove();
    const nxt = resolveNext(node, null);
    addMsg('user', labels.join(', '));
    setInputVisible(false);
    setTimeout(()=>{ addTyping(); setTimeout(()=>{ removeTyping(); advanceStep(nxt); },700); },300);
  };
  d.appendChild(cont);

  msgsEl.appendChild(d);
  scrollBot();
}

function setInputVisible(show){
  inputRow.style.display = show ? 'flex' : 'none';
}

function sendFree(){
  const val = freeInput.value.trim();
  if(!val) return;
  const node = currentFreeNode;
  profile[node.freeKey] = node.freeKey==='age' ? parseInt(val) : val;
  updateProfile();
  freeInput.value = '';
  addMsg('user', val);
  setInputVisible(false);
  addTyping();
  let nxt = typeof node.next==='function' ? node.next(profile) : node.next;
  setTimeout(()=>{ removeTyping(); advanceStep(nxt); }, 700);
}

freeInput.addEventListener('keydown', e=>{ if(e.key==='Enter') sendFree(); });

function initials(name){
  if(!name) return '?';
  return name.split(' ').map(w=>w[0]||'').join('').toUpperCase().slice(0,2);
}

function updateProfile(){
  if(profile.name){
    document.getElementById('pInitials').textContent = initials(profile.name);
    document.getElementById('pName').textContent = profile.name;
  }
  if(profile.age) document.getElementById('pAge').textContent = profile.age;
  if(profile.tobacco !== null && profile.tobacco !== '') document.getElementById('pTobacco').textContent = profile.tobacco ? 'Yes' : 'No';

  const stageLabels = { on:'On Medicare', soon:'Turning 65', under65:'Under 65' };
  if(profile.medicareStage){
    document.getElementById('pState').textContent = stageLabels[profile.medicareStage] || profile.medicareStage;
  }
  if(profile.name && profile.age){
    document.getElementById('pSub').textContent = 'Age ' + profile.age + (profile.medicareStage ? ' · ' + (stageLabels[profile.medicareStage]||'') : '');
  }

  const enrollEl = document.getElementById('pEnroll');
  const covLabels = { original:'Original Medicare', medigap:'Medigap', ma:'Medicare Advantage', new:'New to Medicare' };
  const curLabels = { employer:'Employer plan', marketplace:'Marketplace', none:'No coverage', planning:'Planning ahead' };
  if(profile.medicareCoverage){
    enrollEl.textContent = covLabels[profile.medicareCoverage] || profile.medicareCoverage;
    enrollEl.className = 'badge ' + (profile.medicareCoverage==='medigap'?'badge-teal':profile.medicareCoverage==='ma'?'badge-wb':'badge-gray');
  } else if(profile.currentCoverage){
    enrollEl.textContent = curLabels[profile.currentCoverage] || profile.currentCoverage;
    enrollEl.className = 'badge badge-gray';
  }

  // Focus
  const focusEl = document.getElementById('pPriority');
  const track = deriveTrack(profile);
  if(profile.medicareStage){
    if(track==='ms') focusEl.textContent = 'Medicare Supplement';
    else if(track==='mshave') focusEl.textContent = 'Closing Medigap gaps';
    else if(track==='ma') focusEl.textContent = 'Supplementing Advantage';
    else focusEl.textContent = 'Gap protection';
  }
}

// ── Step runner ───────────────────────────────────────────────────────────
function advanceStep(id){
  if(!id) return;
  currentNodeId = id;
  const node = NODES[id];
  if(!node) return;

  const msg = node.agentFn ? node.agentFn() : node.agent;
  addMsg('agent', msg);

  if(node.type==='result'){
    setTimeout(showResults, 900);
    return;
  }
  if(node.type==='free'){
    currentFreeNode = node;
    freeKey = node.freeKey;
    freeInput.placeholder = node.placeholder || '';
    setInputVisible(true);
    freeInput.focus();
  } else if(node.type==='multi'){
    setInputVisible(false);
    setTimeout(()=> addMulti(node), 100);
  } else {
    setInputVisible(false);
    setTimeout(()=> addChoices(node), 100);
  }
}

// ── Results ───────────────────────────────────────────────────────────────
function showResults(){
  const out = buildRecommendations();
  const recs = out.recs;
  const track = out.track;
  const overall = recs.length ? recs[0].score : 0;

  document.getElementById('resultsCard').classList.remove('hidden');
  document.getElementById('overallScore').textContent = overall + '% Match';

  const body = document.getElementById('resultsBody');
  body.innerHTML = '';

  recs.forEach((m,i)=>{
    const p = m.product;
    const reasons = m.reasons || [];
    const tier = m.tier;
    const riders = m.riders || [];
    const numClass = ['n1','n2','n3','n4','n5'][i] || 'n5';
    const isTop = i===0;

    const card = document.createElement('div');
    card.className = 'rec-card' + (isTop?' top':'');

    card.innerHTML = `
      <div class="rec-top-row">
        <div class="rec-num ${numClass}">${i+1}</div>
        <div class="rec-name">${p.short}</div>
        ${isTop ? '<span class="best-badge">START HERE</span>' : ''}
      </div>
      <div class="rec-desc">${p.desc}</div>
      ${tier ? `<div class="rec-config">Suggested setup: <strong>${tier.label}</strong> — ${tier.desc}</div>` : ''}
      <div class="match-bar-wrap">
        <div class="match-bar-label">
          <span>Coverage fit</span>
          <strong>${m.score}%</strong>
        </div>
        <div class="match-bar-track">
          <div class="match-bar-fill" data-score="${m.score}"></div>
        </div>
      </div>
      <div class="rec-block-h">Why this fits you</div>
      <ul class="rec-reasons">
        ${reasons.map(r=>`<li>${r}</li>`).join('')}
      </ul>
      ${riders.length ? `
      <div class="rec-block-h">Recommended add-ons</div>
      <ul class="rec-reasons rec-addons">
        ${riders.map(r=>`<li><strong>${r.label}</strong> — ${r.desc}</li>`).join('')}
      </ul>` : ''}
      ${isTop ? `<button class="rec-cta" onclick="openModal('${p.name}')">Start ${p.short} Application</button>` : ''}
    `;
    body.appendChild(card);
  });

  // Animate bars
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      document.querySelectorAll('.match-bar-fill').forEach(el=>{
        el.style.width = el.dataset.score + '%';
      });
    });
  });

  // Final advisory message
  setTimeout(()=>{
    const top = recs[0];
    const fn = firstName();
    let msg = "Here’s my recommendation" + (fn ? ", " + fn : "") + ": start with <strong>" + top.product.short + "</strong>";
    if(top.tier) msg += " — specifically the <strong>" + top.tier.label + "</strong>";
    msg += ". ";
    if(track==='ms') msg += "It gives you doctor freedom and predictable costs, and I’ve lined up coverage to close the gaps even a Supplement leaves.";
    else if(track==='mshave') msg += "Your Supplement is doing the heavy lifting — these close the gaps it leaves behind.";
    else if(track==='ma') msg += "We’ll keep your Advantage plan and bolt on protection for exactly where it’s thin.";
    else msg += "These lock in protection now, while it’s easy and affordable to get.";
    if(profile.preneedConcern==='yes') msg += " I’ve also included a pre-arranged funeral plan so that’s never your family’s burden.";
    msg += " Here’s the full picture:";
    addMsg('agent', msg);
  }, 600);
}

// ── Modal ─────────────────────────────────────────────────────────────────
function openModal(productName){
  const name = firstName() || 'you';
  document.getElementById('modalTitle').textContent = 'Start Application?';
  document.getElementById('modalBody').textContent =
    `You're about to start a ${productName} application for ${name}. This will open Enroller to continue. Ready to proceed?`;
  document.getElementById('modal').classList.add('open');
}
function closeModal(){ document.getElementById('modal').classList.remove('open'); }
document.getElementById('modal').addEventListener('click', function(e){
  if(e.target===this) closeModal();
});

// ── Start ─────────────────────────────────────────────────────────────────
setInputVisible(false);
setTimeout(()=>{ advanceStep('intro'); }, 400);
</script>
